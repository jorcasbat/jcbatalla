            <h1>
                Escrí<span>beme.</span>
            </h1>

            <p>
                Las grandes historias también comienzan con una conversación.
            </p>

            <form class="contact-form"
                  action="https://formsubmit.co/jcbatalla.autor@gmail.com"
                  method="POST">

                <input type="text"
                       name="Nombre"
                       placeholder="Nombre"
                       required>

                <input type="email"
                       name="Email"
                       placeholder="Correo electrónico"
                       required>

                <input type="text"
                       name="Asunto"
                       placeholder="Asunto"
                       required>

                          rows="7"
                          placeholder="Escribe tu mensaje..."
                          required></textarea>

                <input type="hidden"
                       name="_subject"
                       value="Nuevo mensaje desde jcbatalla.com">

                <input type="hidden"
                       name="_captcha"
                       value="false">

                <button class="hero-btn" type="submit">
                    Enviar mensaje
                </button>

            </form>
